syntax = "proto3";

package battlecode;

message Replay {
    Map map = 1;
    repeated Turn turns = 3;
    optional Team winner = 4;
}

message Map {
    int32 width = 1;
    int32 height = 2;
    repeated TileRow rows = 3;
    repeated CorePosition cores = 4;
}

message TileRow {
    repeated Environment tiles = 1;
}

message Players {
    Player a = 1;
    Player b = 2;
}

message Player {
    int32 titanium = 1;
    int32 axionite = 2;
    int32 resourcesCollected = 3;
    int32 titaniumCollected = 4;
    int32 axioniteCollected = 5;
}

message Turn {
    repeated Update updates = 1;
}

message Update {
    oneof kind {
        PlaceEntity placeEntity = 1;
        MoveBuilderBot moveBuilderBot = 2;
        RemoveEntity removeEntity = 3;
        DistributeResources distributeResources = 4;
        UpdateHp updateHp = 5;
        UpdatePlayers updatePlayers = 6;
        SetActionCooldown setActionCooldown = 7;
        SetMoveCooldown setMoveCooldown = 8;
        BotOutput botOutput = 9;
        IndicatorLine indicatorLine = 10;
        IndicatorDot indicatorDot = 11;
        FireTurret fireTurret = 12;
        BuilderAttack builderAttack = 13;
    }
}

message PlaceEntity {
    Entity entity = 1;
}

message MoveBuilderBot {
    int32 id = 1;
    Pos to = 2;
}

message RemoveEntity {
    int32 id = 1;
}

message DistributeResources {
    repeated ResourceMove moves = 1;
}

message ResourceMove {
    Pos from = 1;
    Pos to = 2;
    optional int32 resourceId = 3;
}

message UpdateHp {
    int32 id = 1;
    int32 delta = 2;
}

message UpdatePlayers {
    Players players = 1;
}

message SetActionCooldown {
    int32 id = 1;
    int32 value = 2;
}

message SetMoveCooldown {
    int32 id = 1;
    int32 value = 2;
}

message BotOutput {
    int32 id = 1;
    string stdout = 2;
    uint32 execTimeUs = 3;
    bool tled = 4;
}

message IndicatorLine {
    int32 id = 1;
    Pos posA = 2;
    Pos posB = 3;
    int32 r = 4;
    int32 g = 5;
    int32 b = 6;
}

message IndicatorDot {
    int32 id = 1;
    Pos pos = 2;
    int32 r = 3;
    int32 g = 4;
    int32 b = 5;
}

message BuilderAttack {
    int32 id = 1;
}

message FireTurret {
    Pos from = 1;
    Pos to = 2;
}

message Pos {
    int32 x = 1;
    int32 y = 2;
}

message CorePosition {
    int32 id = 1;
    Team team = 2;
    Pos position = 3;
}

message Entity {
    int32 id = 1;
    Team team = 2;
    Pos position = 3;
    int32 hp = 4;
    int32 maxHp = 5;
    
    oneof kind {
        BuilderBot builderBot = 10;
        Conveyor conveyor = 11;
        Splitter splitter = 12;
        ArmouredConveyor armouredConveyor = 13;
        Bridge bridge = 14;
        Harvester harvester = 15;
        Foundry foundry = 16;
        Barrier barrier = 18;
        Core core = 20;
        Gunner gunner = 21;
        Sentinel sentinel = 22;
        Breach breach = 23;
        Launcher launcher = 24;
    }
}

message BuilderBot {
    int32 actionCooldown = 1;
    int32 moveCooldown = 2;
}

message Conveyor {
    Direction direction = 1;
    ResourceType stored = 2;
}

message Splitter {
    Direction direction = 1;
    ResourceType stored = 2;
}

message ArmouredConveyor {
    Direction direction = 1;
    ResourceType stored = 2;
}

message Bridge {
    Pos target = 1;
    ResourceType stored = 2;
}

message Harvester {
    int32 cooldown = 1;
    ResourceType resourceType = 2;
}

message Foundry {
    ResourceType stored = 2;
}

message Barrier {
}

message Core {
    int32 actionCooldown = 1;
}

message Gunner {
    Direction direction = 1;
    ResourceType ammoType = 2;
    int32 ammoAmount = 3;
}

message Sentinel {
    Direction direction = 1;
    ResourceType ammoType = 2;
    int32 ammoAmount = 3;
}

message Breach {
    Direction direction = 1;
    ResourceType ammoType = 2;
    int32 ammoAmount = 3;
}

message Launcher {
    ResourceType ammoType = 2;
    int32 ammoAmount = 3;
}

enum Team {
    TEAM_A = 0;
    TEAM_B = 1;
}

enum Direction {
    DIR_CENTRE = 0;
    DIR_NORTH = 1;
    DIR_NORTHEAST = 2;
    DIR_EAST = 3;
    DIR_SOUTHEAST = 4;
    DIR_SOUTH = 5;
    DIR_SOUTHWEST = 6;
    DIR_WEST = 7;
    DIR_NORTHWEST = 8;
}

enum ResourceType {
    RESOURCE_NONE = 0;
    RESOURCE_TITANIUM = 1;
    RESOURCE_RAW_AXIONITE = 2;
    RESOURCE_REFINED_AXIONITE = 3;
}

enum Environment {
    ENV_EMPTY = 0;
    ENV_WALL = 1;
    ENV_ORE_TITANIUM = 2;
    ENV_ORE_AXIONITE = 3;
}
